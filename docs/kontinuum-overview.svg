<svg xmlns="http://www.w3.org/2000/svg" width="900" height="666" viewBox="0 0 900 666" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f8fc"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f7ff"/>
      <stop offset="1" stop-color="#e3edff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fdf5"/>
      <stop offset="1" stop-color="#dcf7e6"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.13"/>
    </filter>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="666" fill="url(#bg)"/>
  <text x="48" y="50" font-size="24" font-weight="800" fill="#0f172a" letter-spacing="-0.3">How Kontinuum works</text>
  <text x="48" y="76" font-size="14" fill="#64748b">Two config files in. Human-reviewed pull requests out.</text>

  <!-- input: machine config -->
  <rect x="48" y="104" width="386" height="128" rx="14" fill="url(#blue)" stroke="#c7dbff" stroke-width="1" filter="url(#sh)"/>
  <rect x="66" y="120" width="34" height="34" rx="9" fill="#dbe7ff" stroke="#2f6bff" stroke-width="1.2"/>
  <text x="83" y="143" font-size="17" text-anchor="middle">📄</text>
  <text x="112" y="135" font-size="15.5" font-weight="700" fill="#0f172a">config.yaml</text>
  <text x="112" y="153" font-size="11.5" fill="#64748b">your machine · set once</text>
  <text x="68" y="184" font-size="12.5" fill="#334155">• which repos to watch</text>
  <text x="68" y="203" font-size="12.5" fill="#334155">• agent: claude</text>
  <text x="68" y="222" font-size="12.5" fill="#334155">• your identity (bot_login)</text>

  <!-- input: per-repo recipe -->
  <rect x="466" y="104" width="386" height="128" rx="14" fill="url(#blue)" stroke="#c7dbff" stroke-width="1" filter="url(#sh)"/>
  <rect x="484" y="120" width="34" height="34" rx="9" fill="#dbe7ff" stroke="#2f6bff" stroke-width="1.2"/>
  <text x="501" y="143" font-size="17" text-anchor="middle">📄</text>
  <text x="530" y="135" font-size="15.5" font-weight="700" fill="#0f172a">verify.yaml</text>
  <text x="530" y="153" font-size="11.5" fill="#64748b">each repo · committed in .kontinuum/</text>
  <text x="486" y="184" font-size="12.5" fill="#334155">• image: the toolchain</text>
  <text x="486" y="203" font-size="12.5" fill="#334155">• gate: tests, run offline</text>
  <text x="486" y="222" font-size="12.5" fill="#334155">• setup: install deps (optional)</text>

  <!-- connectors into the queue -->
  <g fill="none" stroke="#b2becd" stroke-width="2">
    <path d="M241 232 L241 246 Q241 250 245 250 L655 250 Q659 250 659 246 L659 232"/>
    <line x1="450" y1="250" x2="450" y2="264" marker-end="url(#arw)"/>
  </g>

  <!-- queue -->
  <rect x="240" y="266" width="420" height="78" rx="13" fill="url(#slate)" stroke="#dbe2ea" stroke-width="1" filter="url(#sh)"/>
  <rect x="260" y="284" width="34" height="34" rx="9" fill="#e7edf4" stroke="#64748b" stroke-width="1.2"/>
  <text x="277" y="307" font-size="17" text-anchor="middle">🗂️</text>
  <text x="306" y="298" font-size="14.5" font-weight="700" fill="#0f172a">GitHub issues — the only queue</text>
  <text x="306" y="320" font-size="12" fill="#64748b">label one kontinuum:ready → K claims it (single-owner lease)</text>

  <line x1="450" y1="344" x2="450" y2="374" stroke="#b2becd" stroke-width="2" marker-end="url(#arw)"/>

  <!-- the loop -->
  <rect x="48" y="378" width="804" height="180" rx="16" fill="url(#green)" stroke="#a7e8c0" stroke-width="1.4" filter="url(#sh)"/>
  <rect x="66" y="394" width="34" height="34" rx="9" fill="#d1fadf" stroke="#16a34a" stroke-width="1.2"/>
  <text x="83" y="417" font-size="17" text-anchor="middle">🔁</text>
  <text x="112" y="409" font-size="15.5" font-weight="700" fill="#0f172a">Kontinuum works it — sandboxed, one issue at a time</text>

  <!-- pipeline pills -->
  <g font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">
    <rect x="67"  y="436" width="116" height="44" rx="11" fill="#eef2f7" stroke="#cbd5e1"/>
    <text x="125" y="463">clone</text>
    <rect x="197" y="436" width="116" height="44" rx="11" fill="#e2ecff" stroke="#9dbcff"/>
    <text x="255" y="463">🤖 edit</text>
    <rect x="327" y="436" width="116" height="44" rx="11" fill="#d8f6e4" stroke="#86e0a9"/>
    <text x="385" y="463">✅ gate</text>
    <rect x="457" y="436" width="116" height="44" rx="11" fill="#fef1cd" stroke="#f6cf5f"/>
    <text x="515" y="463">🔎 scan</text>
    <rect x="587" y="436" width="116" height="44" rx="11" fill="#ece7fe" stroke="#c3b4fd"/>
    <text x="645" y="463">👀 review</text>
    <rect x="717" y="436" width="116" height="44" rx="11" fill="#d0f7fb" stroke="#7fd9e6"/>
    <text x="775" y="463">📤 PR</text>
  </g>
  <g font-size="15" fill="#94a3b8" text-anchor="middle">
    <text x="190" y="463">›</text><text x="320" y="463">›</text><text x="450" y="463">›</text>
    <text x="580" y="463">›</text><text x="710" y="463">›</text>
  </g>

  <text x="68" y="508" font-size="12" fill="#475569">🔒 no host secrets · no network · retries with feedback (≤3)</text>
  <text x="68" y="530" font-size="12" fill="#475569">then your repo's own CI runs on the PR before you ever see it</text>

  <line x1="450" y1="558" x2="450" y2="588" stroke="#b2becd" stroke-width="2" marker-end="url(#arw)"/>

  <!-- human gate -->
  <rect x="240" y="590" width="420" height="64" rx="13" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="450" y="618" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="middle">👤 You review &amp; merge</text>
  <text x="450" y="638" font-size="11.5" fill="#64748b" text-anchor="middle">Kontinuum opens PRs — it never merges or deploys itself</text>
</svg>
