<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="544" viewBox="0 0 1040 544" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5f6368"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1040" height="544" fill="#ffffff"/>

  <text x="40" y="48" font-size="26" font-weight="700" fill="#202124">Kinetik — the big picture</text>
  <text x="40" y="76" font-size="15" fill="#5f6368">A robot teammate that turns work into pull requests for you to merge.</text>

  <text x="40" y="120" font-size="13" font-weight="700" fill="#5f6368" letter-spacing="0.5">WHERE THE WORK COMES FROM</text>

  <rect x="40" y="132" width="290" height="64" rx="12" fill="#eaf1fb" stroke="#4285f4" stroke-width="1.8"/>
  <text x="66" y="172" font-size="26">📋</text>
  <text x="100" y="162" font-size="16" font-weight="700" fill="#202124">GitHub issues</text>
  <text x="100" y="182" font-size="12.5" fill="#5f6368">one task each</text>

  <rect x="350" y="132" width="450" height="64" rx="12" fill="#eaf1fb" stroke="#4285f4" stroke-width="1.8"/>
  <text x="376" y="172" font-size="26">📁</text>
  <text x="410" y="162" font-size="16" font-weight="700" fill="#202124">Multi-file spec in the repo</text>
  <text x="410" y="182" font-size="12.5" fill="#5f6368">split into issues, or one K owns the whole spec (locked)</text>

  <line x1="140" y1="196" x2="140" y2="248" stroke="#5f6368" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="575" y1="196" x2="575" y2="216" stroke="#5f6368" stroke-width="2.5"/>
  <line x1="575" y1="216" x2="150" y2="216" stroke="#5f6368" stroke-width="2.5"/>

  <rect x="40" y="250" width="200" height="150" rx="14" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="140" y="295" font-size="38" text-anchor="middle">🎯</text>
  <text x="140" y="330" font-size="17" font-weight="700" fill="#202124" text-anchor="middle">Grab work</text>
  <text x="140" y="354" font-size="12.5" fill="#5f6368" text-anchor="middle">claim one —</text>
  <text x="140" y="371" font-size="12.5" fill="#5f6368" text-anchor="middle">no two K's collide</text>
  <text x="140" y="391" font-size="12" font-weight="700" fill="#34a853" text-anchor="middle">✔ WORKS</text>

  <rect x="280" y="250" width="200" height="150" rx="14" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="380" y="295" font-size="38" text-anchor="middle">🛠️</text>
  <text x="380" y="330" font-size="17" font-weight="700" fill="#202124" text-anchor="middle">Do the work</text>
  <text x="380" y="354" font-size="12.5" fill="#5f6368" text-anchor="middle">real AI in a locked box:</text>
  <text x="380" y="371" font-size="12.5" fill="#5f6368" text-anchor="middle">edit · test · review</text>
  <text x="380" y="391" font-size="12" font-weight="700" fill="#34a853" text-anchor="middle">✔ WORKS</text>

  <rect x="520" y="250" width="200" height="150" rx="14" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="620" y="295" font-size="38" text-anchor="middle">📤</text>
  <text x="620" y="330" font-size="17" font-weight="700" fill="#202124" text-anchor="middle">Open a PR</text>
  <text x="620" y="354" font-size="12.5" fill="#5f6368" text-anchor="middle">push the code &amp;</text>
  <text x="620" y="371" font-size="12.5" fill="#5f6368" text-anchor="middle">check CI</text>
  <text x="620" y="391" font-size="12" font-weight="700" fill="#34a853" text-anchor="middle">✔ WORKS</text>

  <rect x="760" y="250" width="200" height="150" rx="14" fill="#ffffff" stroke="#34a853" stroke-width="2"/>
  <text x="860" y="295" font-size="38" text-anchor="middle">👤</text>
  <text x="860" y="330" font-size="17" font-weight="700" fill="#202124" text-anchor="middle">You merge</text>
  <text x="860" y="354" font-size="12.5" fill="#5f6368" text-anchor="middle">review &amp; merge —</text>
  <text x="860" y="371" font-size="12.5" fill="#5f6368" text-anchor="middle">it never merges itself</text>
  <text x="860" y="391" font-size="12" font-weight="700" fill="#34a853" text-anchor="middle">the human gate</text>

  <g stroke="#5f6368" stroke-width="2.5" marker-end="url(#a)">
    <line x1="242" y1="325" x2="276" y2="325"/>
    <line x1="482" y1="325" x2="516" y2="325"/>
    <line x1="722" y1="325" x2="756" y2="325"/>
  </g>

  <text x="40" y="452" font-size="13" fill="#5f6368">• The real Claude AI does the work in a locked box (no secrets, no network) — edits, runs its own tests, then an AI reviews it.</text>
  <text x="40" y="474" font-size="13" fill="#5f6368">• Every change is gate-tested + secret-scanned + AI-reviewed, and its CI is watched — before it ever reaches you to merge.</text>
  <text x="40" y="496" font-size="13" fill="#5f6368">• Split a spec across many K's or lock one whole; the lock lives on GitHub. One K per person, many repos, 24/7. Laptop login or a server key.</text>
  <text x="40" y="518" font-size="13" fill="#5f6368">• Holds its claim while working (heartbeat), retries with feedback, survives errors. Commands: run · onboard · status · pause.</text>
</svg>
