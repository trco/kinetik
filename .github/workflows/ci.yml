name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest      # Docker is available -> the sandbox/pipeline tests run for real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]'
      - run: pytest -q           # full suite, including the Docker containment tests
