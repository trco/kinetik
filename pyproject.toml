[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kinetik"
version = "0.0.0"
requires-python = ">=3.9"
dependencies = ["pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "ruff"]

[project.scripts]
kinetik = "kinetik.cli:main"

[tool.setuptools]
packages = ["kinetik"]      # flat layout: install only the package, not tests/

[tool.setuptools.package-data]
kinetik = ["bundled_plugins/**/*"]   # ship the injected .claude/ plugin bundle

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
