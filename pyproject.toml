[project]
name = "kontinuum"
version = "0.0.0"
requires-python = ">=3.9"
dependencies = ["pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "ruff"]

[project.scripts]
kontinuum = "kontinuum.loop:main"

[project.scripts]
kontinuum = "kontinuum.loop:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
