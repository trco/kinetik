<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1000" viewBox="0 0 1040 1000" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5f6368"/>
    </marker>
    <marker id="arrowDash" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="1000" fill="#ffffff"/>
  <text x="30" y="40" font-size="23" font-weight="700" fill="#202124">Kontinuum — code flow (entry → current end)</text>
  <text x="30" y="64" font-size="14" fill="#5f6368">The full spine runs today with a stand-in AI. Only the real AI, reviewer and CI are left.</text>

  <g font-size="12.5" fill="#3c4043">
    <rect x="700" y="20" width="15" height="15" rx="3" fill="#e6f4ea" stroke="#34a853"/>
    <text x="721" y="32">works now (proven live)</text>
    <rect x="700" y="41" width="15" height="15" rx="3" fill="#fef7e0" stroke="#f9ab00"/>
    <text x="721" y="53">stand-in / plug point</text>
    <rect x="890" y="20" width="15" height="15" rx="3" fill="#f1f3f4" stroke="#9aa0a6" stroke-dasharray="2 3"/>
    <text x="911" y="32">not built yet</text>
  </g>

  <!-- main path -->
  <rect x="110" y="88" width="400" height="50" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="128" y="110" font-size="14.5" font-weight="700" fill="#202124">1 · kontinuum run</text>
  <text x="128" y="128" font-size="12" fill="#5f6368">__main__.py → main()</text>

  <rect x="110" y="150" width="400" height="50" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="128" y="172" font-size="14.5" font-weight="700" fill="#202124">2 · main() — the forever loop</text>
  <text x="128" y="190" font-size="12" fill="#5f6368">loop.py · reads config.yaml, loops over your repos</text>

  <rect x="110" y="212" width="400" height="50" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="128" y="234" font-size="14.5" font-weight="700" fill="#202124">3 · run_once → poll_ready</text>
  <text x="128" y="252" font-size="12" fill="#5f6368">gh issue list · kontinuum:ready [+ your assignee]</text>

  <rect x="110" y="274" width="400" height="50" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="128" y="296" font-size="14.5" font-weight="700" fill="#202124">4 · handle_issue</text>
  <text x="128" y="314" font-size="12" fill="#5f6368">hold? → release &amp; skip · else → try to claim</text>

  <rect x="110" y="336" width="400" height="64" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="128" y="358" font-size="14.5" font-weight="700" fill="#202124">5 · attempt_claim — single-owner</text>
  <text x="128" y="376" font-size="12" fill="#5f6368">read → claim → re-read; first-id wins, loser yields.</text>
  <text x="128" y="392" font-size="12" fill="#5f6368">one K per issue, even across machines.</text>

  <rect x="560" y="343" width="360" height="50" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="1.2"/>
  <text x="576" y="365" font-size="12.5" font-weight="700" fill="#202124">claim.py resolve_owner + github.py</text>
  <text x="576" y="382" font-size="11.5" fill="#5f6368">issue comments on GitHub = the shared lock</text>
  <line x1="510" y1="368" x2="558" y2="368" stroke="#5f6368" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- step 6: the pipeline -->
  <rect x="110" y="422" width="810" height="212" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="128" y="446" font-size="15" font-weight="700" fill="#202124">6 · execute() — the pipeline (make_executor) · proven end-to-end live</text>

  <text x="140" y="474" font-size="13" fill="#3c4043">① clone the repo into a temp folder</text>
  <text x="140" y="500" font-size="13" fill="#3c4043">② 🔒 Sandbox — no host secrets, no network</text>
  <text x="140" y="526" font-size="13" fill="#3c4043">③ 🤖 agent edits the code</text>
  <text x="140" y="552" font-size="13" fill="#3c4043">④ ✅ gate — build &amp; test inside the sandbox</text>
  <text x="140" y="578" font-size="13" fill="#3c4043">⑤ 🔎 secret-scan the diff (block leaks before push)</text>
  <text x="140" y="604" font-size="13" fill="#3c4043">⑥ 📤 open PR → comment issue → set pr-open label</text>

  <!-- stand-in callout on the agent line -->
  <rect x="470" y="512" width="435" height="30" rx="15" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.6"/>
  <text x="486" y="531" font-size="12.5" font-weight="700" fill="#b06000">stand-in AI now — real Claude SDK plugs in here  ◀ YOU ARE HERE</text>

  <g stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="310" y1="138" x2="310" y2="148"/>
    <line x1="310" y1="200" x2="310" y2="210"/>
    <line x1="310" y1="262" x2="310" y2="272"/>
    <line x1="310" y1="324" x2="310" y2="334"/>
    <line x1="310" y1="400" x2="310" y2="420"/>
  </g>

  <!-- divider todo -->
  <line x1="30" y1="668" x2="1010" y2="668" stroke="#dadce0" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="30" y="690" font-size="14" font-weight="700" fill="#5f6368">STILL TO DO — make it real</text>

  <line x1="310" y1="634" x2="310" y2="712" stroke="#9aa0a6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>

  <rect x="110" y="714" width="400" height="48" rx="8" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="128" y="735" font-size="14" font-weight="700" fill="#3c4043">7 · Reviewer — independent LLM check</text>
  <text x="128" y="752" font-size="12" fill="#5f6368">a second look before the PR is trusted</text>

  <rect x="110" y="772" width="400" height="48" rx="8" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="128" y="793" font-size="14" font-weight="700" fill="#3c4043">8 · Wait for CI → ready to merge</text>
  <text x="128" y="810" font-size="12" fill="#5f6368">read CI status; green = done, human merges</text>

  <rect x="110" y="830" width="400" height="48" rx="8" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="128" y="851" font-size="14" font-weight="700" fill="#3c4043">9 · Plug pipeline into the 24/7 daemon</text>
  <text x="128" y="868" font-size="12" fill="#5f6368">needs a per-repo test recipe (gate cmd + image)</text>

  <g stroke="#9aa0a6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowDash)">
    <line x1="310" y1="762" x2="310" y2="770"/>
    <line x1="310" y1="820" x2="310" y2="828"/>
  </g>

  <!-- human -->
  <rect x="560" y="800" width="360" height="60" rx="8" fill="#ffffff" stroke="#34a853" stroke-width="1.5"/>
  <text x="576" y="825" font-size="15" font-weight="700" fill="#202124">👤 You review the PR and merge</text>
  <text x="576" y="845" font-size="12.5" fill="#5f6368">Kontinuum never merges or deploys itself.</text>
  <line x1="510" y1="830" x2="558" y2="830" stroke="#9aa0a6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
</svg>
